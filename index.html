<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png"><title>Polymer Dose Calculator</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827;max-width:640px;margin:auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h1{text-align:center;font-size:23px}.toggle{display:flex;background:#e5e7eb;border-radius:12px;padding:3px}.toggle button{flex:1;border:0;background:0;padding:11px;border-radius:9px;font-weight:700;font-size:16px}.toggle button.active{background:#111827;color:#fff}
label{display:block;font-weight:650;font-size:14px;margin:14px 0 6px}.row{display:grid;grid-template-columns:1fr 130px;gap:10px}
input,select{width:100%;box-sizing:border-box;font-size:18px;padding:12px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
.result-input{background:#eef2ff;font-weight:800}.unit{font-size:14px;color:#4b5563}
.solve{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center}
.density{display:grid;grid-template-columns:1fr 1fr;gap:12px}.density>div{background:#f9fafb;padding:10px;border-radius:12px}.density .row{grid-template-columns:1fr 65px;gap:5px}
.reset,.clear{width:100%;border:0;border-radius:10px;padding:12px;margin-top:12px;font-weight:700;font-size:15px;background:#e5e7eb}
.result{background:#111827;color:#fff;border-radius:16px;padding:18px;margin-top:16px}.value{font-size:30px;font-weight:800}.small{font-size:13px;opacity:.75}.sub{font-size:14px;opacity:.85}
.formula{text-align:center;background:#f9fafb;padding:14px;border-radius:12px;line-height:1.8}.note{text-align:center;color:#6b7280;font-size:12px}
.hidden{display:none!important}
</style></head><body>
<div class="card"><h1>Polymer Dose Calculator</h1>
<div class="toggle" id="mode"><button class="active" data-mode="neat">NEAT</button><button data-mode="active">ACTIVE</button></div></div>

<div class="card"><b>Solve For</b>
<div class="solve"><span>Variable</span><select id="solve">
<option value="dose">Dose</option><option value="fp">Polymer Flow (Fp)</option>
<option value="cp">Polymer Concentration (Cp)</option><option value="fs">Sludge Flow (Fs)</option>
<option value="cs">Sludge Concentration (Cs)</option></select></div>
<label>Flow Units</label><div class="toggle" id="units"><button class="active" data-unit="gpm">gal/min</button><button data-unit="gph">gal/hr</button></div></div>

<div class="card"><b>Densities</b><div class="density">
<div><label>Dp</label><div class="row"><input id="dp" type="number" step="any" value="8.60"><span class="unit">lb/gal</span></div></div>
<div><label>Ds</label><div class="row"><input id="ds" type="number" step="any" value="8.34"><span class="unit">lb/gal</span></div></div></div>
<button class="reset" id="reset">Reset Density Defaults</button></div>

<div class="card"><div id="fields"></div><div id="active"></div>
<div id="result" class="result hidden"><div class="small" id="rl"></div><div class="value" id="rv"></div><div class="sub" id="rs"></div></div>
<button class="clear" id="clear">Clear Inputs</button></div>

<div class="card"><div class="formula">Neat Dose = (Fp × Cp × Dp) / ((Fs × Cs × Ds) / 2000)<br>
<small>Dp = 8.60 lb/gal &nbsp; • &nbsp; Ds = 8.34 lb/gal</small></div></div>
<p class="note">Density edits apply only while this app session is open. Reopening restores Dp 8.60 and Ds 8.34.</p>

<script>
const D0=8.60,S0=8.34;let mode="neat",unit="gpm",dp=D0,ds=S0;
const v={dose:null,fp:null,cp:null,fs:null,cs:null,active:null};
const meta={dose:["Dose","lbs / dry ton"],fp:["Polymer Flow (Fp)",null],cp:["Polymer Concentration (Cp)","%"],fs:["Sludge Flow (Fs)",null],cs:["Sludge Concentration (Cs)","%"]};
const $=x=>document.getElementById(x), flow=()=>unit==="gpm"?"gal/min":"gal/hr";
function render(){
 let t=$("solve").value;
 $("fields").innerHTML=Object.keys(meta).map(k=>{let m=meta[k],q=k===t;
 return `<label>${m[0]}${q?" <span style='color:#6b7280'>(calculated)</span>":""}</label>
 <div class="row"><input id="v-${k}" class="${q?"result-input":""}" type="number" step="any" ${q?"readonly":""} value="${v[k]??""}"><span class="unit">${m[1]||flow()}</span></div>`}).join("");
 $("active").innerHTML=mode==="active"?`<label>% Active</label><div class="row"><input id="v-active" type="number" step="any" value="${v.active??""}" placeholder="e.g. 50"><span class="unit">%</span></div>`:"";
 [...Object.keys(meta),...(mode==="active"?["active"]:[])].forEach(k=>{let e=$("v-"+k);if(e)e.oninput=()=>{v[k]=e.value===""?null:Number(e.value);calc()}});
 calc();
}
function neat(x){if([x.fp,x.cp,x.fs,x.cs].some(z=>z==null)||x.fs===0||x.cs===0)return null;
return x.fp*(x.cp/100)*dp/((x.fs*(x.cs/100)*ds)/2000)}
function solve(x,t){
 let D=x.dose,F=x.fp,C=x.cp,Fs=x.fs,Cs=x.cs;
 if(t==="dose")return neat(x);
 if(t==="fp"&&D!=null&&C!=null&&Fs!=null&&Cs!=null&&C!==0)return D*(Fs*(Cs/100)*ds)/(2000*(C/100)*dp);
 if(t==="cp"&&D!=null&&F!=null&&Fs!=null&&Cs!=null&&F!==0)return D*(Fs*(Cs/100)*ds)/(2000*F*dp)*100;
 if(t==="fs"&&D!=null&&F!=null&&C!=null&&Cs!=null&&D!==0)return F*(C/100)*dp*2000/(D*(Cs/100)*ds);
 if(t==="cs"&&D!=null&&F!=null&&C!=null&&Fs!=null&&D!==0)return F*(C/100)*dp*2000/(D*Fs*ds)*100;
 return null;
}
function calc(){
 let t=$("solve").value,x={...v},r=null,label=meta[t][0],sub=meta[t][1]||flow();
 if(mode==="neat")r=solve(x,t);
 else if(t==="dose"){let n=neat(x);if(n!=null&&x.active!=null)r=n*x.active/100;label="Active Dose";sub="lbs active polymer / dry ton"}
 else if(x.dose!=null&&x.active>0){x.dose=x.dose/(x.active/100);r=solve(x,t)}
 let e=$("v-"+t);
 if(r!=null&&Number.isFinite(r)){v[t]=r;if(e)e.value=Number(r).toLocaleString(undefined,{maximumFractionDigits:4});
 $("rl").textContent=label;$("rv").textContent=Number(r).toLocaleString(undefined,{maximumFractionDigits:4});$("rs").textContent=sub;$("result").classList.remove("hidden")}
 else $("result").classList.add("hidden");
}
$("solve").onchange=render;
document.querySelectorAll("#mode button").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("#mode button").forEach(x=>x.classList.toggle("active",x===b));render()});
document.querySelectorAll("#units button").forEach(b=>b.onclick=()=>{unit=b.dataset.unit;document.querySelectorAll("#units button").forEach(x=>x.classList.toggle("active",x===b));render()});
$("dp").oninput=e=>{dp=Number(e.target.value)||0;calc()};$("ds").oninput=e=>{ds=Number(e.target.value)||0;calc()};
$("reset").onclick=()=>{dp=D0;ds=S0;$("dp").value=D0;$("ds").value=S0;calc()};
$("clear").onclick=()=>{Object.keys(v).forEach(k=>v[k]=null);render()};
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
